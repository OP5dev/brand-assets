<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noise Rest R02 font study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&amp;family=Manrope:wght@300;700&amp;family=Sora:wght@300;600&amp;family=Lexend:wght@300;600&amp;family=Plus+Jakarta+Sans:wght@300;700&amp;family=DM+Sans:wght@300;700&amp;family=Space+Grotesk:wght@300;600&amp;family=Figtree:wght@300;700&amp;family=Urbanist:wght@300;700&amp;family=Albert+Sans:wght@300;700&amp;family=Red+Hat+Display:wght@300;700&amp;family=Work+Sans:wght@300;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;600&amp;family=Josefin+Sans:wght@300;600&amp;family=Poppins:wght@300;600&amp;family=Instrument+Sans:wght@400;600&amp;family=IBM+Plex+Sans:wght@300;600&amp;family=Quicksand:wght@300;700&amp;family=Nunito:wght@300;800&amp;family=Comfortaa:wght@300;700&amp;family=JetBrains+Mono:wght@300;500;700&amp;family=IBM+Plex+Mono:wght@300;600&amp;family=DM+Mono:wght@300;500&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4A7A7F}a:hover{color:#2E3440}
</style>
</helmet>
<div style="width:1448px; height:1780px; box-sizing:border-box; padding:48px; background:#F2F4F7; font-family:Outfit, system-ui, sans-serif; color:#2E3440; display:flex; flex-direction:column; gap:32px">
<div style="height:90px; box-sizing:border-box; padding-bottom:20px; border-bottom:1px solid #DDE2EA; display:flex; justify-content:space-between; align-items:flex-end">
<div style="display:flex; flex-direction:column; gap:8px">
<div style="font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.2em; color:#55735B">NOISE REST / 11</div>
<h1 style="margin:0; font-family:Outfit, sans-serif; font-weight:300; font-size:40px; letter-spacing:0.01em">R02 font study</h1>
</div>
<div style="font-family:'JetBrains Mono', monospace; font-size:12px; color:#4C566A">24 typefaces · ink noise, accent line + block, knocked-out rest · Tweaks: accent</div>
</div>
<div style="flex:1; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); grid-auto-rows:240px; gap:24px">
<sc-for list="{{fonts}}" as="item" hint-placeholder-count="24">
<div style="background:#FAFBFC; border:1px solid #DDE2EA; border-radius:16px; display:flex; flex-direction:column; overflow:hidden">
<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px">
<div style="display:inline-flex; flex-direction:column; align-items:center; font-family:{{item.ff}}">
<span style="font-weight:{{item.nw}}; font-size:{{item.ns}}px; letter-spacing:0.14em; margin-right:-0.14em; line-height:1.15; color:#2E3440">noise</span>
<span style="align-self:stretch; height:3px; margin:8px -8px 0; background:{{accent}}; border-radius:2px"></span>
<span style="padding:3px 14px 6px; background:{{accent}}; color:#FAFBFC; font-weight:{{item.rw}}; font-size:{{item.rs}}px; line-height:1.15; border-radius:0 0 4px 4px">rest</span>
</div>
</div>
<div style="display:flex; gap:10px; align-items:baseline; padding:12px 18px; border-top:1px solid #E5E9F0; font-family:'JetBrains Mono', monospace; font-size:12px; color:#4C566A"><span style="color:#55735B; font-weight:500">{{item.id}}</span><span>{{item.name}}</span><span style="margin-left:auto">{{item.wt}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B8B72","options":["#6B8B72","#4F7F83","#5E81AC","#4C566A"]},"$preview":{"width":1448,"height":1780}}'>
class Component extends DCLogic {
renderVals() {
const f = (id, name, ff, nw, rw, ns, rs) => ({ id, name, ff, nw, rw, ns, rs, wt: nw + ' / ' + rw });
return {
accent: this.props.accent ?? '#6B8B72',
fonts: [
f('F01', 'Outfit', 'Outfit, sans-serif', 300, 600, 38, 24),
f('F02', 'Manrope', 'Manrope, sans-serif', 300, 700, 38, 24),
f('F03', 'Sora', 'Sora, sans-serif', 300, 600, 36, 23),
f('F04', 'Lexend', 'Lexend, sans-serif', 300, 600, 36, 23),
f('F05', 'Plus Jakarta Sans', "'Plus Jakarta Sans', sans-serif", 300, 700, 38, 24),
f('F06', 'DM Sans', "'DM Sans', sans-serif", 300, 700, 38, 24),
f('F07', 'Space Grotesk', "'Space Grotesk', sans-serif", 300, 600, 38, 24),
f('F08', 'Figtree', 'Figtree, sans-serif', 300, 700, 38, 24),
f('F09', 'Urbanist', 'Urbanist, sans-serif', 300, 700, 40, 25),
f('F10', 'Albert Sans', "'Albert Sans', sans-serif", 300, 700, 38, 24),
f('F11', 'Red Hat Display', "'Red Hat Display', sans-serif", 300, 700, 38, 24),
f('F12', 'Work Sans', "'Work Sans', sans-serif", 300, 600, 36, 23),
f('F13', 'Jost', 'Jost, sans-serif', 300, 600, 40, 25),
f('F14', 'Josefin Sans', "'Josefin Sans', sans-serif", 300, 600, 42, 26),
f('F15', 'Poppins', 'Poppins, sans-serif', 300, 600, 36, 23),
f('F16', 'Instrument Sans', "'Instrument Sans', sans-serif", 400, 600, 38, 24),
f('F17', 'IBM Plex Sans', "'IBM Plex Sans', sans-serif", 300, 600, 38, 24),
f('F18', 'Quicksand', 'Quicksand, sans-serif', 300, 700, 38, 24),
f('F19', 'Nunito', 'Nunito, sans-serif', 300, 800, 38, 24),
f('F20', 'Comfortaa', 'Comfortaa, sans-serif', 300, 700, 34, 22),
f('F21', 'JetBrains Mono', "'JetBrains Mono', monospace", 300, 700, 30, 22),
f('F22', 'IBM Plex Mono', "'IBM Plex Mono', monospace", 300, 600, 30, 22),
f('F23', 'DM Mono', "'DM Mono', monospace", 300, 500, 30, 22),
f('F24', 'Space Mono', "'Space Mono', monospace", 400, 700, 30, 22)
]
};
}
}
</script>
</body>
</html>
